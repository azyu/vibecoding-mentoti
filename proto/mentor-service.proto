syntax = "proto3";

package mentor;

option go_package = "./mentor";

// 멘토 관리 서비스
service MentorService {
  // 멘토 목록 조회
  rpc GetMentors(GetMentorsRequest) returns (GetMentorsResponse);
  
  // 멘토 상세 조회
  rpc GetMentor(GetMentorRequest) returns (GetMentorResponse);
  
  // 기술 스택으로 멘토 검색
  rpc SearchMentorsBySkill(SearchMentorsBySkillRequest) returns (SearchMentorsBySkillResponse);
  
  // 멘토 가용성 확인
  rpc CheckMentorAvailability(CheckMentorAvailabilityRequest) returns (CheckMentorAvailabilityResponse);
}

// 멘토 정보
message Mentor {
  int32 id = 1;
  string email = 2;
  string name = 3;
  string bio = 4;
  repeated string skills = 5;
  string profile_image_url = 6;
  bool is_available = 7;
  int64 created_at = 8;
  int64 updated_at = 9;
}

// 멘토 목록 조회 요청
message GetMentorsRequest {
  string skill_filter = 1;
  SortOrder sort_order = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// 정렬 옵션
enum SortOrder {
  ID_ASC = 0;
  NAME_ASC = 1;
  SKILL_ASC = 2;
}

// 멘토 목록 조회 응답
message GetMentorsResponse {
  bool success = 1;
  string message = 2;
  repeated Mentor mentors = 3;
  int32 total_count = 4;
}

// 멘토 상세 조회 요청
message GetMentorRequest {
  int32 mentor_id = 1;
}

// 멘토 상세 조회 응답
message GetMentorResponse {
  bool success = 1;
  string message = 2;
  Mentor mentor = 3;
}

// 기술 스택으로 멘토 검색 요청
message SearchMentorsBySkillRequest {
  string skill = 1;
  SortOrder sort_order = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// 기술 스택으로 멘토 검색 응답
message SearchMentorsBySkillResponse {
  bool success = 1;
  string message = 2;
  repeated Mentor mentors = 3;
  int32 total_count = 4;
}

// 멘토 가용성 확인 요청
message CheckMentorAvailabilityRequest {
  int32 mentor_id = 1;
}

// 멘토 가용성 확인 응답
message CheckMentorAvailabilityResponse {
  bool success = 1;
  string message = 2;
  bool is_available = 3;
}